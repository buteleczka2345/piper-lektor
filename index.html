<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tłumacz & Lektor na Żywo</title>
    <meta name="description" content="Tłumacz w czasie rzeczywistym z języka angielskiego na polski z lektorem głosowym." />
    <script>
      // Safe guard for window.fetch property assignment from extensions or scripts
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(val) {
              _origFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch descriptor initialization:', e);
        }
      })();
    </script>
  </head>
  <body class="bg-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
